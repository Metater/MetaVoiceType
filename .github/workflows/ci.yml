name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore MetaVoiceType.slnx
      - run: dotnet test MetaVoiceType.slnx -c Release --no-restore
      - run: dotnet publish src/MetaVoiceType/MetaVoiceType.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: MetaVoiceType-win-x64
          path: artifacts/publish

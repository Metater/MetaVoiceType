name: Versioned Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: metavoicetype-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore MetaVoiceType.slnx
      - run: dotnet build MetaVoiceType.slnx -c Release --no-restore
      - run: dotnet test MetaVoiceType.slnx -c Release --no-build --no-restore
      - shell: pwsh
        run: ./scripts/Test-ReleaseDecision.ps1
      - id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-ReleaseDecision.ps1 -Repository $env:GITHUB_REPOSITORY -OutputFile $env:GITHUB_OUTPUT
      - if: steps.version.outputs.shouldRelease == 'true'
        run: dotnet tool install --global vpk --version 1.2.0
      - if: steps.version.outputs.shouldRelease == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/package.ps1 -Version "${{ steps.version.outputs.version }}" -SkipTests
      - if: steps.version.outputs.shouldRelease == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: MetaVoiceType ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/releases/*
